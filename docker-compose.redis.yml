# Redis (dev/prod 공유) — 한 번만 실행
services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - shared

volumes:
  redis_data:

networks:
  shared:
    name: enbuge_shared
    driver: bridge
