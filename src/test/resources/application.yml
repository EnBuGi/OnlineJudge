spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: testsecrettestsecrettestsecrettestsecrettestsecrettestsecret
  access-expiration: 3600000
  refresh-expiration: 1209600000
  cookie:
    refresh-token-max-age-seconds: 1209600
    secure: false
    same-site: Strict
    path: /

github:
  client-id: test-client-id
  client-secret: test-client-secret

security:
  paths-to-permit:
    all: "/api/v1/auth/**,/api/v1/invites/**,/api/v1/admin/invites,/v3/api-docs/**,/swagger-ui/**"
    get: "/api/v1/invites/validate"
    post: "/api/v1/auth/login/github,/api/v1/auth/signup/github,/api/v1/admin/invites"
